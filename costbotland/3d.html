<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CostBotLand 3D</title>
<link rel="icon" href="../shared/assets/costbot.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#080510;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;}
  #park{position:absolute;inset:0;}
  #park canvas{display:block;cursor:grab}
  #park canvas:active{cursor:grabbing}
  #boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#080510;color:#c9b4e0;font-family:'Segoe UI',system-ui,sans-serif;gap:14px;z-index:5;}
  #boot img{width:96px;animation:b 2s ease-in-out infinite}
  @keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .pill{display:flex;gap:7px;align-items:center;background:rgba(16,10,26,.78);border:1px solid #4a3a66;color:#d9c2e6;
    text-decoration:none;padding:7px 14px;border-radius:20px;font:600 13px 'Segoe UI',system-ui,sans-serif;
    backdrop-filter:blur(4px);cursor:pointer;transition:background .14s,color .14s,border-color .14s;white-space:nowrap}
  .pill:hover{background:#2f1f45;color:#fff;border-color:#8a5aa0}
  .pill.on{background:#3a2458;color:#fff;border-color:#b58ad0}
  .pill img{width:18px;height:18px;object-fit:contain}
  #top{position:fixed;top:12px;left:14px;right:14px;z-index:6;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #top .sp{flex:1}
  #title{font:800 18px 'Segoe UI',system-ui,sans-serif;color:#fff;text-shadow:0 0 12px #a855f7;letter-spacing:.3px}
  #views{position:fixed;bottom:14px;left:14px;right:14px;z-index:6;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
  #views .pill{pointer-events:auto}
  #views .pill{border-color:var(--c,#4a3a66)}
  #hint{position:fixed;bottom:60px;left:0;right:0;z-index:6;color:#a996c4;
    font:12px 'Segoe UI',system-ui,sans-serif;text-align:center;transition:opacity .6s;pointer-events:none;white-space:nowrap}
  @media (max-width:640px){#title{display:none}#hint{display:none}.pill{padding:6px 10px;font-size:12px}}
</style>
<script type="importmap">
{ "imports": {
    "three": "../shared/vendor/three/three.module.min.js",
    "three/addons/": "../shared/vendor/three/addons/"
} }
</script>
</head>
<body>
  <div id="top">
    <a class="pill" href="../index.html" title="Back to the CostBot Arcade"><img src="../shared/assets/costbot.png" alt="">← Arcade</a>
    <a class="pill" href="index.html" title="Play the CostBotLand game">🎮 Play</a>
    <span class="sp"></span>
    <span id="title">CostBotLand 3D</span>
    <span class="sp"></span>
    <button class="pill" id="tour" type="button" title="Tour the park (T)">🎥 Tour</button>
    <button class="pill on" id="fw" type="button" title="Fireworks (F)">🎆</button>
  </div>
  <div id="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan · click a land to fly there · click CostBot 🕺</div>
  <div id="views"></div>
  <div id="park"></div>
  <div id="boot"><img src="../shared/assets/costbot.png" alt=""><div>Building the park…</div></div>

  <script src="cl-content.js?v=6"></script>
  <script type="module">
    import { mount } from './cl-3d.js';
    const C = window.CostBotLandContent;
    const views = document.getElementById('views');
    const buttons = {};
    const addView = (id, label, color) => {
      const b = document.createElement('button');
      b.className = 'pill'; b.type = 'button'; b.textContent = label;
      if (color) b.style.setProperty('--c', color);
      b.onclick = () => park.focus(id);
      views.appendChild(b); buttons[id] = b;
    };
    addView('overview', '🗺️ Overview');
    addView('castle', '🏰 Castle', '#f4b41a');
    C.LANDS.forEach((l) => { addView(l.id, `${l.emoji} ${l.name}`, l.color); });

    const tourBtn = document.getElementById('tour'), fwBtn = document.getElementById('fw');
    const park = mount('#park', {
      onEvent(type, p) {
        if (type === 'focus') Object.entries(buttons).forEach(([id, b]) => { b.classList.toggle('on', id === p.name); });
        if (type === 'focus' || type === 'tour') tourBtn.classList.toggle('on', type === 'tour' ? p.on : p.touring);
        if (type === 'fireworks') fwBtn.classList.toggle('on', p.on);
      },
    });
    window.park = park;
    tourBtn.onclick = () => park.tour(!park.touring);
    fwBtn.onclick = () => park.toggleFireworks();
    buttons.overview.classList.add('on');
    setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 9000);
    const b = document.getElementById('boot');
    requestAnimationFrame(() => { b.style.transition = 'opacity .5s'; b.style.opacity = 0; setTimeout(() => b.remove(), 520); });
  </script>
</body>
</html>
