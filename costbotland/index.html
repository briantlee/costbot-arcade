<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CostBotLand</title>
<link rel="icon" href="../shared/assets/costbot.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#080510;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;}
  #game{position:absolute;inset:0;}
  #boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#080510;color:#c9b4e0;font-family:'Segoe UI',system-ui,sans-serif;gap:14px;z-index:5;}
  #boot img{width:96px;animation:b 2s ease-in-out infinite}
  @keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  #back{position:fixed;top:12px;left:14px;z-index:6;display:flex;gap:7px;align-items:center;
    background:rgba(16,10,26,.78);border:1px solid #4a3a66;color:#d9c2e6;text-decoration:none;
    padding:7px 14px;border-radius:20px;font:600 13px 'Segoe UI',system-ui,sans-serif;
    backdrop-filter:blur(4px);transition:opacity .3s,background .14s,color .14s;}
  #back:hover{background:#2f1f45;color:#fff;border-color:#8a5aa0;opacity:1 !important;}
  #back img{width:18px;height:18px;object-fit:contain}
  #back.dim{opacity:0;pointer-events:none}
  #mute{position:fixed;bottom:14px;left:14px;z-index:6;display:flex;align-items:center;justify-content:center;
    width:38px;height:34px;background:rgba(16,10,26,.78);border:1px solid #4a3a66;color:#d9c2e6;
    border-radius:20px;font-size:16px;cursor:pointer;backdrop-filter:blur(4px);
    transition:background .14s,color .14s,border-color .14s;}
  #mute:hover{background:#2f1f45;color:#fff;border-color:#8a5aa0;}
  /* Visible-during-play quit-to-menu button. Unlike #back (which dims to avoid
     misclicks during real-time movement) this one must stay up and clickable
     the whole run — it's the only discoverable way out besides the Esc key —
     so it's hidden by default and only shown between run:start and run:end. */
  #quit{position:fixed;top:14px;right:14px;z-index:6;display:none;align-items:center;justify-content:center;
    width:38px;height:34px;background:rgba(16,10,26,.78);border:1px solid #4a3a66;color:#d9c2e6;
    border-radius:20px;font-size:16px;cursor:pointer;backdrop-filter:blur(4px);
    transition:background .14s,color .14s,border-color .14s;}
  #quit.show{display:flex;}
  #quit:hover{background:#2f1f45;color:#fff;border-color:#8a5aa0;}
</style>
</head>
<body>
  <a id="back" href="../index.html" title="Back to the CostBot Arcade">
    <img src="../shared/assets/costbot.png" alt="">← Arcade</a>
  <button id="mute" type="button" title="Mute (M)">🔊</button>
  <button id="quit" type="button" title="Quit to menu (Esc)">✕</button>
  <div id="game"></div>
  <div id="boot"><img src="../shared/assets/costbot.png" alt=""><div>Opening the gates…</div></div>

  <script src="../shared/arcade-sync.js"></script>
  <script src="../shared/arcade-wallet.js"></script>
  <script src="../shared/arcade-music.js"></script>
  <script src="../shared/arcade-biomes.js"></script>
  <script src="cl-content.js?v=6"></script>
  <script src="cl-game.js?v=10"></script>
  <script>
    let game;
    (async () => {
      const session = window.ArcadeSync ? await window.ArcadeSync.init() : { enabled: false };
      game = CostBotLand.mount('#game', {
        showShell: true,
        persist: true,
        meta: session.enabled && window.ArcadeSync.gameProfile
          ? window.ArcadeSync.gameProfile('costbotland') || undefined
          : undefined,
        onEvent(type, payload) {
          if (type !== 'ready') console.log('[CostBotLand]', type, payload);
          const back = document.getElementById('back');
          if (back && type === 'run:start') back.classList.add('dim');
          if (back && type === 'run:end') back.classList.remove('dim');
          // #quit is the opposite of #back: hidden at the menu (nothing to quit),
          // shown for the whole run so there's a discoverable way out besides Esc.
          const quit = document.getElementById('quit');
          if (quit && type === 'run:start') quit.classList.add('show');
          if (quit && type === 'run:end') quit.classList.remove('show');
          if (type === 'mute') { const mb = document.getElementById('mute');
            if (mb) mb.textContent = payload.muted ? '🔇' : '🔊'; }
        },
        onComplete(result) {
          console.log('[CostBotLand] day complete', result);
          if (window.ArcadeSync && window.ArcadeSync.enabled) {
            window.ArcadeSync.saveGame('costbotland', game.meta);
            window.ArcadeSync.submit(result, null);
          }
        },
      });
      window.game = game;
      const mb = document.getElementById('mute');
      if (mb) { mb.textContent = game.muted ? '🔇' : '🔊'; mb.onclick = () => game.toggleMute(); }
      const qb = document.getElementById('quit');
      if (qb) qb.onclick = () => game.quit();
      if (session.enabled) {
        setInterval(() => window.ArcadeSync.saveGame('costbotland', game.meta), 20000);
      }
    })();
    window.addEventListener('load', () => {
      const b = document.getElementById('boot');
      setTimeout(() => { b.style.transition = 'opacity .4s'; b.style.opacity = 0;
        setTimeout(() => b.remove(), 420); }, 300);
    });
  </script>
</body>
</html>
