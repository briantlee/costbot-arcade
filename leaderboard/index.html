<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CostBot Arcade — Leaderboards</title>
<link rel="icon" href="../shared/assets/costbot.png">
<style>
  :root{--gold:#f0a52c;--line:#2b3f66;--panel:#131c30;--fg:#e8eef8;--muted:#93a4c4;--teal:#7fd6c4;--green:#6ee7a0;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1a2744,#05070d 65%);
    color:var(--fg);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding:36px 20px 60px;}
  .wrap{max-width:820px;margin:0 auto}
  header{text-align:center;margin-bottom:22px}
  h1{margin:0}
  /* Same trick as the hub logo: screen-blend the pixel art's dark grid away. */
  .hs{width:190px;max-width:60vw;display:block;margin:0 auto;mix-blend-mode:screen}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .who{margin-top:10px;font-size:12.5px;color:var(--teal)}
  .back{display:inline-block;margin-top:14px;color:var(--teal);font-size:13px;text-decoration:none;
    border:1px solid var(--line);padding:6px 14px;border-radius:20px}
  .back:hover{background:#1b2740;color:#fff}

  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:26px 0 16px}
  .tab{background:rgba(255,255,255,.04);border:1px solid #31456b;color:#a9bad6;padding:8px 16px;
    border-radius:20px;font-size:13px;font-weight:650;cursor:pointer;font-family:inherit;transition:.14s}
  .tab:hover{background:#22355c;color:#fff}
  .tab.on{background:linear-gradient(180deg,#f0a52c,#d4821a);border-color:#ffc866;color:#241403}

  /* CostBot Hero's own song+difficulty filter — a couple dozen songs x 4
     difficulties is too many combinations to show as separate always-visible
     tables, so one focused table + these two filters (instead of a giant
     everything-at-once list) is what keeps the board on one screen. */
  .hero-filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
    padding:14px 18px 4px}
  .hero-filters select{background:#0f1830;border:1px solid var(--line);color:var(--fg);
    font-size:13px;font-family:inherit;padding:7px 10px;border-radius:9px;cursor:pointer;
    max-width:220px}
  .diff-pills{display:flex;gap:6px}
  .diff-pill{background:rgba(255,255,255,.04);border:1px solid #31456b;color:#a9bad6;
    padding:6px 13px;border-radius:16px;font-size:12.5px;font-weight:650;cursor:pointer;
    font-family:inherit;transition:.14s}
  .diff-pill:hover{background:#22355c;color:#fff}
  .diff-pill.on{background:linear-gradient(180deg,#f0a52c,#d4821a);border-color:#ffc866;color:#241403}
  .panel{background:linear-gradient(180deg,#141d33,#0c1220);border:1px solid var(--line);
    border-radius:14px;padding:6px 4px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
  .board-title{font-size:12px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;
    padding:14px 18px 8px;font-weight:700}
  .board-note{padding:0 18px 6px;font-size:12.5px;color:#6b7c9a}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:1px;color:#7e8fae;text-transform:uppercase;
    padding:8px 18px;border-bottom:1px solid #1e2c47;font-weight:700}
  td{padding:11px 18px;font-size:14.5px;border-bottom:1px solid #16223a}
  tr:last-child td{border-bottom:none}
  tr.me td{background:rgba(240,165,44,.08)}
  tr.me .name{color:var(--gold);font-weight:700}
  .rank{width:52px;color:#7e8fae;font-variant-numeric:tabular-nums;font-weight:700}
  .rank.p1{color:#ffd76b}.rank.p2{color:#cfd8e6}.rank.p3{color:#d8a06a}
  .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--green);font-weight:700}
  .val.dim{color:var(--muted);font-weight:500;font-size:13px}
  /* Sortable metric columns. The one being ranked on is lit; the rest read as
     supporting detail, the same way each cabinet's own board does it. */
  th.n{text-align:right}
  th.n[data-sort]{cursor:pointer;user-select:none}
  th.n[data-sort]:hover{color:#cfe0f7}
  th.n.on{color:var(--gold)}
  td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
  td.n.on{color:var(--green);font-weight:700}
  .empty{padding:34px 18px;text-align:center;color:#6b7c9a;font-size:14px;line-height:1.7}
  .note{margin-top:18px;font-size:12.5px;color:#6b7c9a;text-align:center;line-height:1.7}
  .note code{background:#141d31;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="hs" src="../shared/assets/highscore-pixel.png" alt="High score"></h1>
    <p class="sub">Best runs across the CostBot Arcade — each cabinet ranked on what it actually measures.</p>
    <div class="who" id="who"></div>
    <a class="back" href="../index.html">← Back to the Arcade</a>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"><div class="empty">Loading…</div></div>
  <p class="note" id="note"></p>
</div>

<script src="../shared/arcade-sync.js"></script>
<script>
  const money = (n) => '$' + Math.round(n).toLocaleString('en-US');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // Players are labelled by the name the server resolved. A bare hub id is a PERNR,
  // so if one ever reaches a board show an anonymous handle rather than the number.
  const short = (p) => {
    const v = String(p || '');
    if (/^\d{4,}$/.test(v)) return 'Player ' + v.slice(-4);
    return v.split('@')[0];
  };

  // ---------------------------------------------------------------------------
  // ONE BOARD PER CABINET, RANKED ON WHAT THAT CABINET MEASURES.
  //
  // Every game used to be ranked in dollars, because dollars is the field the
  // shared `runs` table has always had. That reads as a lie on two of the three:
  // Mudslides is a downhill run and fishing is a lake — neither saves anybody any
  // money, so a "best run" of $25,150 was a token haul multiplied by an invented
  // rate. Only Waste Hunter deletes real waste, so only Waste Hunter shows money.
  //
  // The other two get the metrics their own in-cabinet boards already show, from
  // /api/leaderboards/<game>, which ranks each metric independently. `sort` is the
  // headline metric — the column the board opens ranked on.
  // ---------------------------------------------------------------------------
  const GAMES = [
    { id: 'waste-hunter', tab: '🗑️ Waste Hunter', kind: 'stages',
      note: 'All-time best run per stage. This is real money — every kill is a resource that was costing something.' },
    { id: 'mudslides', tab: '⛰️ Mudslides', kind: 'metrics', sort: 'distance',
      // `mudsliders` is the pre-rename key; runs recorded under it are the same game.
      also: ['mudsliders'],
      cols: [
        { key: 'distance', label: 'Distance', unit: 'm' },
        { key: 'topSpeed', label: 'Top speed' },
        { key: 'nearMisses', label: 'Near misses' },
        { key: 'tokens', label: 'Tokens' },
      ],
      note: 'Distance is the score — how far you got before the hill got you. Click a column to rank on it.' },
    { id: 'holiday-in-colombia', tab: '🎣 Holiday in Colombia', kind: 'metrics', sort: 'streak',
      cols: [
        { key: 'streak', label: 'Longest streak' },
        { key: 'heaviest', label: 'Heaviest', unit: 'kg' },
        { key: 'fish', label: 'Fish landed' },
        { key: 'tokens', label: 'Tokens' },
      ],
      note: 'Streak is the skill — it cannot be got by luck, only by not losing a fish. Heaviest is the brag.' },
    { id: 'costbotland', tab: '🎢 CostBotLand', kind: 'metrics', sort: 'score',
      cols: [
        { key: 'score', label: 'Dollars earned', unit: 'money' },
        { key: 'guests', label: 'Guests kept happy' },
        { key: 'stars', label: 'Park rating' },
        { key: 'uptime', label: 'Ride uptime', unit: '%' },
        { key: 'combo', label: 'Best combo' },
      ],
      note: 'Dollars earned is the score — every ticket, gate check, and reunited kid pays out real park cash. Guests kept happy is the volume; park rating is the brag.' },
    { id: 'quiz-show', tab: '📺 CostBot Quiz Show', kind: 'metrics', sort: 'totalEarned',
      cols: [
        { key: 'totalEarned', label: 'Total earnings', unit: 'money' },
        { key: 'streak', label: 'Best streak' },
        { key: 'tokens', label: 'Tokens' },
      ],
      note: 'Total earnings is every round you have banked, added up — beat Max Tokens often enough and you climb.' },
    { id: 'costbot-hero', tab: '🎸 CostBot Hero', kind: 'hero',
      note: 'Best score is the biggest single run — the song and difficulty it was set on ride along, so a Hard run stands apart from an Easy one.' },
  ];

  const STAGE_NAMES = {
    'ec2-graveyard': 'The EC2 Graveyard',
    'storage-sprawl': 'Storage Sprawl',
    'the-ledger': "The Megabill's Ledger",
    endless: 'Endless Descent',
    lake: 'The Lake',
  };

  // Deep link: a #<game-id> hash (e.g. from a cabinet's "🏆 Leaderboard" button)
  // opens straight to that board.
  const hashTab = (location.hash || '').replace(/^#/, '');
  let stagesData = null, me = null, tab = GAMES.some((g) => g.id === hashTab) ? hashTab : GAMES[0].id;
  // gameBoards() is one fetch per cabinet, so cache what came back — flipping
  // between tabs should not re-hit the API every time.
  const metricCache = {};

  function head(cols, sort) {
    return cols.map((c) => `<th class="n ${c.key === sort ? 'on' : ''}" data-sort="${c.key}"
      >${esc(c.label)}${c.key === sort ? ' ▾' : ''}</th>`).join('');
  }

  function cell(row, c, sort) {
    const v = Number(row[c.key] || 0);
    const txt = c.unit === 'kg' ? v.toFixed(1) + ' kg'
      : c.unit === 'money' ? money(v)
      : Math.round(v).toLocaleString('en-US') + (c.unit ? ' ' + c.unit : '');
    return `<td class="n ${c.key === sort ? 'on' : ''}">${txt}</td>`;
  }

  function table(title, note, headHtml, list, cols) {
    const body = (list || []).map((r, i) => {
      const mine = me && r.player === me;
      return `<tr class="${mine ? 'me' : ''}">
        <td class="rank ${i < 3 ? 'p' + (i + 1) : ''}">${i + 1}</td>
        <td class="name">${esc(short(r.player))}</td>
        ${cols(r)}
      </tr>`;
    }).join('');
    return `<div class="board-title">${esc(title)}</div>`
      + (note ? `<div class="board-note">${esc(note)}</div>` : '')
      + (body
        ? `<table><thead><tr><th class="rank">#</th><th>Player</th>${headHtml}</tr></thead><tbody>${body}</tbody></table>`
        : `<div class="empty">No runs recorded yet.<br>Play this one and you will be the first name here.</div>`);
  }

  // Waste Hunter: one board per stage, ranked in dollars saved.
  function renderStages(g) {
    const keys = [g.id, ...(g.also || [])];
    const ids = Object.keys(stagesData && stagesData.stages || {})
      .filter((k) => keys.includes(k.split('/')[0]));
    if (!ids.length) {
      return table('All-time best per stage', g.note, '<th class="n">Best run</th>', [], () => '');
    }
    return ids.map((id) => {
      const st = id.split('/')[1];
      return table(STAGE_NAMES[st] || st, g.note, '<th class="n">Best run</th>',
        stagesData.stages[id], (r) => `<td class="val">${money(r.dollars)}</td>`);
    }).join('');
  }

  // Mudslides / fishing: the server ranks each metric on its own, so fold them
  // into one row per player and let a single table be sorted by any column —
  // exactly what each cabinet's own board does with the same payload.
  function foldMetrics(payloads, cols) {
    const byPlayer = new Map();
    for (const data of payloads) {
      if (!data || !data.metrics) continue;
      for (const key of Object.keys(data.metrics)) {
        for (const row of data.metrics[key] || []) {
          const p = byPlayer.get(row.player) || { player: row.player };
          p[key] = Math.max(p[key] || 0, Number(row.value) || 0);
          byPlayer.set(row.player, p);
        }
      }
    }
    // A player only belongs on this board if they actually put a number on one of
    // ITS columns. Without this, someone whose only run was in another cabinet
    // rides along on a shared metric (tokens) with zeros everywhere else.
    return [...byPlayer.values()].filter((p) => cols.some((c) => (p[c.key] || 0) > 0));
  }

  function renderMetrics(g) {
    const rows = metricCache[g.id];
    if (!rows) return `<div class="empty">Loading…</div>`;
    const sort = g.sort;
    const sorted = rows.slice().sort((a, b) => (b[sort] || 0) - (a[sort] || 0));
    return table(`Best run — ${g.cols.find((c) => c.key === sort).label}`, g.note,
      head(g.cols, sort), sorted, (r) => g.cols.map((c) => cell(r, c, sort)).join(''));
  }

  // CostBot Hero: leaders for one song+difficulty combination at a time.
  // There are enough songs x 4 difficulties now that a single everything-
  // at-once list stopped being a real "leaderboard" for any one of them — two
  // filters (a song dropdown, since there are too many for a pill row; a
  // difficulty pill row, since there are only 4) keep it to one focused table
  // per combination, on one screen.
  const HERO_DIFFS = ['Easy', 'Normal', 'Hard', 'Ultra'];
  let heroSong = 'all', heroDiff = 'all';
  function renderHero(g) {
    const rows = metricCache[g.id];
    if (!rows) return `<div class="empty">Loading…</div>`;
    const songs = [...new Set(rows.map((r) => r.song).filter(Boolean))].sort();
    const filtered = rows.filter((r) =>
      (heroSong === 'all' || r.song === heroSong) && (heroDiff === 'all' || r.difficulty === heroDiff));
    const sorted = filtered.sort((a, b) => (b.score || 0) - (a.score || 0));
    const filtersHtml = `<div class="hero-filters">
        <select id="hero-song-filter">
          <option value="all"${heroSong === 'all' ? ' selected' : ''}>All songs</option>
          ${songs.map((s) => `<option value="${esc(s)}"${s === heroSong ? ' selected' : ''}>${esc(s)}</option>`).join('')}
        </select>
        <div class="diff-pills">
          <button type="button" class="diff-pill${heroDiff === 'all' ? ' on' : ''}" data-diff="all">All</button>
          ${HERO_DIFFS.map((d) => `<button type="button" class="diff-pill${d === heroDiff ? ' on' : ''}" data-diff="${d}">${d}</button>`).join('')}
        </div>
      </div>`;
    const headHtml = `<th class="n on">Best score</th>` + (heroSong === 'all' ? `<th>Song</th>` : '')
      + (heroDiff === 'all' ? `<th>Difficulty</th>` : '') + `<th class="n">Combo</th><th class="n">Accuracy</th>`;
    const title = 'Top scores' + (heroSong !== 'all' ? ` — ${heroSong}` : '') + (heroDiff !== 'all' ? ` (${heroDiff})` : '');
    return filtersHtml + table(title, g.note, headHtml, sorted, (r) =>
      `<td class="n on">${money(r.score || 0)}</td>`
      + (heroSong === 'all' ? `<td>${esc(r.song || '—')}</td>` : '')
      + (heroDiff === 'all' ? `<td>${esc(r.difficulty || '—')}</td>` : '')
      + `<td class="n">${Math.round(r.combo || 0).toLocaleString('en-US')}</td>`
      + `<td class="n">${Math.round(r.accuracy || 0)}%</td>`);
  }

  function render() {
    const panel = document.getElementById('panel');
    if (!stagesData) {
      panel.innerHTML = `<div class="empty">
        Leaderboards need the arcade app.<br>
        This page is running from static hosting, which has no scores API —
        open the arcade on aix-proto to see them.</div>`;
      return;
    }
    const g = GAMES.find((x) => x.id === tab) || GAMES[0];
    panel.innerHTML = g.kind === 'stages' ? renderStages(g)
      : g.kind === 'hero' ? renderHero(g)
      : renderMetrics(g);
  }

  // Clicking a metric header re-ranks that cabinet's board, and clicking a
  // CostBot Hero difficulty pill re-filters it. Both delegated on the panel
  // because render() replaces its contents wholesale.
  document.getElementById('panel').addEventListener('click', (e) => {
    const pill = e.target.closest('.diff-pill[data-diff]');
    if (pill) { heroDiff = pill.dataset.diff; render(); return; }
    const th = e.target.closest('th[data-sort]');
    if (!th) return;
    const g = GAMES.find((x) => x.id === tab);
    if (!g || g.kind !== 'metrics') return;
    g.sort = th.dataset.sort;
    render();
  });
  // Picking a song in the CostBot Hero filter re-renders to just that song.
  document.getElementById('panel').addEventListener('change', (e) => {
    if (e.target.id === 'hero-song-filter') { heroSong = e.target.value; render(); }
  });

  // Quiz accuracy used to be a tab here. It ranked how well people answered
  // trivia, which is not what anyone comes to a leaderboard for, and it sat oddly
  // next to a board about money saved.
  const tabBox = document.getElementById('tabs');
  GAMES.forEach((g) => {
    const b = document.createElement('button');
    b.className = 'tab' + (g.id === tab ? ' on' : '');
    b.textContent = g.tab;
    b.onclick = () => {
      tab = g.id;
      document.querySelectorAll('.tab').forEach((t) => { t.classList.remove('on'); });
      b.classList.add('on');
      render();
      if (g.kind !== 'stages' && !metricCache[g.id]) loadMetrics(g);
    };
    tabBox.appendChild(b);
  });

  async function loadMetrics(g) {
    const keys = [g.id, ...(g.also || [])];
    const payloads = await Promise.all(keys.map((k) => window.ArcadeSync.gameBoards(k)));
    metricCache[g.id] = g.kind === 'hero'
      ? ((payloads[0] && payloads[0].records) || [])
      : foldMetrics(payloads, g.cols);
    if (tab === g.id) render();
  }

  // ---------------------------------------------------------------------------
  // LOCAL PREVIEW MOCK — this page has no scores API when served statically
  // (see the `else` branch below), which normally means an empty CostBot Hero
  // board with nothing to actually review. Seeding representative fake rows
  // here (real song names, a plausible score/combo/accuracy spread across
  // difficulties) lets the board's layout/columns be checked locally without
  // needing the real aix-proto-hosted app. Mock rows never touch `me`, so
  // nothing is ever highlighted as "your" row, and the note below makes clear
  // this isn't live data.
  const MOCK_HERO_ROWS = [
    // Game of Loans gets rows across all 4 difficulties, several with more
    // than one player, so the song+difficulty filters have something real to
    // narrow down to (not just one row per combination).
    { player: 'Player 4417', score: 1701800, song: 'Game of Loans', difficulty: 'Hard',   combo: 176, accuracy: 91 },
    { player: 'nrodriguez',  score: 1688300, song: 'Game of Loans', difficulty: 'Hard',   combo: 171, accuracy: 90 },
    { player: 'jchen',       score: 1520900, song: 'Game of Loans', difficulty: 'Hard',   combo: 158, accuracy: 87 },
    { player: 'aokafor',     score: 2091400, song: 'Game of Loans', difficulty: 'Ultra',  combo: 209, accuracy: 96 },
    { player: 'mschmidt',    score: 1974600, song: 'Game of Loans', difficulty: 'Ultra',  combo: 197, accuracy: 94 },
    { player: 'bpatel',      score: 1102300, song: 'Game of Loans', difficulty: 'Normal', combo: 130, accuracy: 89 },
    { player: 'Player 8802', score: 1054700, song: 'Game of Loans', difficulty: 'Normal', combo: 118, accuracy: 86 },
    { player: 'kolawale',    score: 611200,  song: 'Game of Loans', difficulty: 'Easy',   combo: 88,  accuracy: 92 },
    { player: 'nrodriguez',  score: 2184500, song: 'Write-Off!',              difficulty: 'Ultra',  combo: 214, accuracy: 97 },
    { player: 'aokafor',     score: 1889200, song: 'Write-Off!',              difficulty: 'Ultra',  combo: 190, accuracy: 93 },
    { player: 'jchen',       score: 1963200, song: "It's a Small Cost",       difficulty: 'Hard',   combo: 188, accuracy: 95 },
    { player: 'bpatel',      score: 1745600, song: "It's a Small Cost",       difficulty: 'Hard',   combo: 169, accuracy: 92 },
    { player: 'aokafor',     score: 1522000, song: 'The Savengers',           difficulty: 'Hard',   combo: 163, accuracy: 93 },
    { player: 'mschmidt',    score: 1340600, song: 'Tariffa',                 difficulty: 'Normal', combo: 152, accuracy: 89 },
    { player: 'Player 5510', score: 1288400, song: 'Tariffa',                 difficulty: 'Normal', combo: 145, accuracy: 87 },
    { player: 'bpatel',      score: 1198400, song: 'Imperial Markup',         difficulty: 'Normal', combo: 140, accuracy: 88 },
    { player: 'Player 8802', score: 964700,  song: 'Blind Spend',             difficulty: 'Normal', combo: 121, accuracy: 84 },
    { player: 'kolawale',    score: 742300,  song: 'Kalm Before the Bill',    difficulty: 'Easy',   combo: 98,  accuracy: 90 },
    { player: 'jchen',       score: 683100,  song: 'Kalm Before the Bill',    difficulty: 'Easy',   combo: 91,  accuracy: 88 },
  ];
  // Same local-preview-mock idea as CostBot Hero above, shaped to each
  // cabinet's own `cols` (see GAMES) so renderMetrics() needs no changes.
  // stars are whole numbers (out of 5) — the shared cell() renderer rounds
  // any column with no declared `unit` (see GAMES' costbotland cols, which
  // don't give "Park rating" one), so a decimal average would just silently
  // round away here; keep the mock consistent with what the board can show.
  const MOCK_COSTBOTLAND_ROWS = [
    { player: 'nrodriguez',  score: 48200, guests: 184, stars: 5, uptime: 97, combo: 62 },
    { player: 'aokafor',     score: 41900, guests: 167, stars: 5, uptime: 95, combo: 54 },
    { player: 'jchen',       score: 37650, guests: 151, stars: 5, uptime: 93, combo: 49 },
    { player: 'mschmidt',    score: 33100, guests: 139, stars: 4, uptime: 91, combo: 41 },
    { player: 'Player 4417', score: 28800, guests: 122, stars: 5, uptime: 89, combo: 38 },
    { player: 'bpatel',      score: 21400, guests: 98,  stars: 4, uptime: 86, combo: 30 },
  ];
  const MOCK_QUIZSHOW_ROWS = [
    { player: 'jchen',       totalEarned: 184600, streak: 22, tokens: 740 },
    { player: 'kolawale',    totalEarned: 156200, streak: 18, tokens: 625 },
    { player: 'nrodriguez',  totalEarned: 129800, streak: 15, tokens: 519 },
    { player: 'Player 8802', totalEarned: 98400,  streak: 12, tokens: 394 },
    { player: 'aokafor',     totalEarned: 74100,  streak: 9,  tokens: 296 },
    { player: 'mschmidt',    totalEarned: 52300,  streak: 7,  tokens: 209 },
  ];

  (async () => {
    const s = window.ArcadeSync ? await window.ArcadeSync.init() : { enabled: false };
    if (s.enabled) {
      // boards label rows with the resolved name, so match on that — comparing
      // against the raw hub id never hit and your own row was never highlighted
      me = s.displayName || s.hubId;
      // prefer the resolved name — the hub id is a PERNR and reads as nobody
      document.getElementById('who').textContent =
        'Signed in as ' + short(s.displayName || s.hubId);
      stagesData = await window.ArcadeSync.boards();
      document.getElementById('note').innerHTML = stagesData && stagesData.source === 'memory'
        ? 'Running without a database — these standings are in-memory and reset when the app restarts.'
        : '';
      render();
      // Warm every cabinet's board up front: three small requests, and flipping
      // tabs then costs nothing.
      GAMES.filter((g) => g.kind !== 'stages').forEach(loadMetrics);
    } else {
      // No scores API locally — open straight on CostBot Hero (unless a hash
      // already picked a different tab) and seed it with mock rows so the
      // board itself is actually reviewable, not just an empty state.
      if (!GAMES.some((g) => g.id === hashTab)) {
        tab = 'costbot-hero';
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('on'));
        const heroBtn = [...document.querySelectorAll('.tab')].find((t) => t.textContent === '🎸 CostBot Hero');
        if (heroBtn) heroBtn.classList.add('on');
      }
      stagesData = { stages: {}, source: 'mock' };
      metricCache['costbot-hero'] = MOCK_HERO_ROWS;
      metricCache['costbotland'] = MOCK_COSTBOTLAND_ROWS;
      metricCache['quiz-show'] = MOCK_QUIZSHOW_ROWS;
      document.getElementById('note').innerHTML =
        'Served statically, so there is no scores API here — CostBot Hero, CostBotLand and CostBot Quiz ' +
        'Show below are showing mock rows for local preview, not real scores. The full arcade with live ' +
        'boards lives on aix-proto.';
      render();
    }
  })();
</script>
</body>
</html>
