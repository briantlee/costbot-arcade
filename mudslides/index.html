<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CostBot Mudslides</title>
<link rel="icon" href="../shared/assets/costbot.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#05070d;overflow:hidden;}
  #game{position:absolute;inset:0;}
  /* Navigation belongs to the shell page, not the game. */
  #back{position:fixed;top:12px;left:14px;z-index:6;display:flex;gap:7px;align-items:center;
    background:rgba(14,9,5,.8);border:1px solid #4a3a28;color:#e0cdb4;text-decoration:none;
    padding:7px 14px;border-radius:20px;font:600 13px 'Segoe UI',system-ui,sans-serif;
    backdrop-filter:blur(4px);transition:opacity .3s,background .14s;}
  #back:hover{background:#2a1d12;color:#fff;opacity:1 !important;}
  #back img{width:18px;height:18px;object-fit:contain}
  #back.dim{opacity:0;pointer-events:none}
</style>
</head>
<body>
  <a id="back" href="../index.html" title="Back to the CostBot Arcade">
    <img src="../shared/assets/costbot.png" alt="">← Arcade</a>
  <div id="game"></div>

  <script src="../shared/arcade-sync.js"></script>
  <script src="../shared/arcade-wallet.js"></script>
  <script src="../shared/arcade-music.js"></script>
  <script src="ms-content.js"></script>
  <script src="ms-game.js"></script>
  <script>
    let game;
    (async () => {
      const sync = window.ArcadeSync;
      const session = sync ? await sync.init() : { enabled: false };
      // Each game keeps its own slice of the shared server profile, so Mudslides
      // progress and Waste Hunter progress never overwrite one another.
      //
      // Three copies can be in play, and they are MERGED rather than ranked —
      // whichever one has the achievement keeps it. Booting from the server
      // slice alone quietly took back anything whose profile write never landed,
      // so a run that hit terminal velocity could finish, save, and come back
      // without the achievement. The game was also called "mudsliders" until it
      // wasn't, so that slice folds in too and is written back under the new key.
      const saved = session.enabled && sync.adopt
        ? sync.adopt('mudslides',
          sync.reconcile(sync.gameProfile('mudsliders'), Mudslides.loadProfile()))
        : null;

      game = Mudslides.mount('#game', {
        profile: saved || undefined,
        onEvent(type, payload) {
          if (type !== 'ready') console.log('[Mudslides]', type, payload);
          const back = document.getElementById('back');
          if (back && type === 'run:start') back.classList.add('dim');
          if (back && type === 'run:end') back.classList.remove('dim');
        },
        onComplete(result) {
          console.log('[Mudslides] run complete', result);
          if (sync && sync.enabled) {
            sync.saveGame('mudslides', result.profile);
            sync.submit(result, null);
          }
        },
      });
      window.game = game;
    })();
  </script>
</body>
</html>
