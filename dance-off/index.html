<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CostBot: Dance Off!</title>
<link rel="icon" href="../shared/assets/costbot.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#05030c;overflow:hidden;}
  #game{position:absolute;inset:0;}
  #boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#05030c;color:#a99bd6;font-family:'Segoe UI',system-ui,sans-serif;gap:14px;z-index:5;}
  #boot img{width:96px;animation:b .5s ease-in-out infinite alternate}
  @keyframes b{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-10px) rotate(6deg)}}
  /* Navigation belongs to the shell page, not the game. */
  #back{position:fixed;top:12px;right:14px;z-index:6;display:flex;gap:7px;align-items:center;
    background:rgba(12,8,28,.78);border:1px solid #3a2d66;color:#c9bdf0;text-decoration:none;
    padding:7px 14px;border-radius:20px;font:600 13px 'Segoe UI',system-ui,sans-serif;
    backdrop-filter:blur(4px);transition:opacity .3s,background .14s,color .14s;}
  #back:hover{background:#2a1d55;color:#fff;border-color:#6a55b5;opacity:1 !important;}
  #back img{width:18px;height:18px;object-fit:contain}
  #back.dim{opacity:0;pointer-events:none}
</style>
<script type="importmap">
{ "imports": {
    "three": "../shared/vendor/three/three.module.min.js",
    "three/addons/": "../shared/vendor/three/addons/"
} }
</script>
</head>
<body>
  <a id="back" href="../index.html" title="Back to the CostBot Arcade">
    <img src="../shared/assets/costbot.png" alt="">← Arcade</a>
  <div id="game"></div>
  <div id="boot"><img src="../shared/assets/costbot.png" alt=""><div>Polishing the mirror ball…</div></div>

  <script src="../shared/arcade-sync.js"></script>
  <script src="../shared/arcade-wallet.js"></script>
  <script src="../shared/arcade-music.js"></script>
  <script type="module">
    import { mount } from './do-game.js';
    // Standalone shell. On the aix-proto app ArcadeSync also carries a server
    // profile; on static hosting it finds no API and stays silent.
    const sync = window.ArcadeSync;
    const session = sync ? await sync.init() : { enabled: false };
    const game = mount('#game', {
      profile: session.enabled && sync.gameProfile ? sync.gameProfile('dance-off') || undefined : undefined,
      onEvent(type, payload) {
        if (type !== 'ready') console.log('[DanceOff]', type, payload);
        const back = document.getElementById('back');
        if (back && type === 'run:start') back.classList.add('dim');
        if (back && type === 'run:end') back.classList.remove('dim');
      },
      onComplete(result) {
        if (!sync || !sync.enabled) return;
        sync.saveGame('dance-off', result.profile);
        sync.submit(result, null);
      },
    });
    window.game = game;
    const b = document.getElementById('boot');
    setTimeout(() => { b.style.transition = 'opacity .4s'; b.style.opacity = 0; setTimeout(() => b.remove(), 420); }, 300);
  </script>
</body>
</html>
