<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CostBot Hero</title>
<link rel="icon" href="../shared/assets/costbot.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060f;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;}
  #game{position:absolute;inset:0;}
  #boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:#05060f;color:#8ea3cc;gap:14px;z-index:5;}
  #boot img{width:96px;animation:b 1.6s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,215,106,.65))}
  @keyframes b{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
  /* Navigation belongs to the shell page; an embedded host supplies its own. */
  #back{position:fixed;top:12px;left:14px;z-index:6;display:flex;gap:7px;align-items:center;
    background:rgba(8,11,26,.78);border:1px solid #2b3f66;color:#a9bad6;text-decoration:none;
    padding:7px 14px;border-radius:20px;font:600 13px 'Segoe UI',system-ui,sans-serif;
    backdrop-filter:blur(4px);transition:opacity .3s,background .14s,color .14s;}
  #back:hover{background:#1d2b45;color:#fff;border-color:#5a7cb5;opacity:1 !important;}
  #back img{width:18px;height:18px;object-fit:contain}
  #back.dim{opacity:0;pointer-events:none}
  #mute{position:fixed;bottom:14px;left:14px;z-index:6;display:flex;align-items:center;justify-content:center;
    width:38px;height:34px;background:rgba(8,11,26,.78);border:1px solid #2b3f66;color:#a9bad6;
    border-radius:20px;font-size:16px;cursor:pointer;backdrop-filter:blur(4px);
    transition:background .14s,color .14s,border-color .14s;}
  #mute:hover{background:#1d2b45;color:#fff;border-color:#5a7cb5;}
</style>
</head>
<body>
  <a id="back" href="../index.html" title="Back to the CostBot Arcade">
    <img src="../shared/assets/costbot.png" alt="">← Arcade</a>
  <button id="mute" type="button" title="Mute (M)">🔊</button>
  <div id="game"></div>
  <div id="boot"><img src="../shared/assets/cb_hero.png" alt=""><div>Tuning the highway…</div></div>

  <script src="../shared/arcade-sync.js"></script>
  <script src="../shared/arcade-wallet.js"></script>
  <script src="../shared/arcade-music.js?v=39"></script>
  <script src="../shared/arcade-biomes.js"></script>
  <script src="ch-game.js?v=74"></script>
  <script>
    // Standalone shell: full menu, song + difficulty select, localStorage records.
    // When the arcade is served by the aix-proto app there is also a server-side
    // profile; ArcadeSync supplies it and stays silent on static hosting.
    let game;
    (async () => {
      const session = window.ArcadeSync ? await window.ArcadeSync.init() : { enabled: false };
      game = CostBotHero.mount('#game', {
        showShell: true,
        persist: true,
        meta: session.enabled && window.ArcadeSync.gameProfile
          ? window.ArcadeSync.gameProfile('costbot-hero') || undefined
          : undefined,
        onEvent(type, payload) {
          if (type !== 'ready') console.log('[CostBotHero]', type, payload);
          const back = document.getElementById('back');
          if (back && type === 'run:start') back.classList.add('dim');
          if (back && type === 'run:end') back.classList.remove('dim');
          if (type === 'mute') { const mb = document.getElementById('mute');
            if (mb) mb.textContent = payload.muted ? '🔇' : '🔊'; }
        },
        onComplete(result) {
          console.log('[CostBotHero] song complete', result);
          if (window.ArcadeSync && window.ArcadeSync.enabled) {
            window.ArcadeSync.saveGame('costbot-hero', game.meta);
            window.ArcadeSync.submit(result, null);
          }
        },
      });
      window.game = game;
      const mb = document.getElementById('mute');
      if (mb) { mb.textContent = game.muted ? '🔇' : '🔊'; mb.onclick = () => game.toggleMute(); }
      if (session.enabled) {
        setInterval(() => window.ArcadeSync.saveGame('costbot-hero', game.meta), 20000);
      }
    })();
    window.addEventListener('load', () => {
      const b = document.getElementById('boot');
      setTimeout(() => { b.style.transition = 'opacity .4s'; b.style.opacity = 0;
        setTimeout(() => b.remove(), 420); }, 300);
    });
  </script>
</body>
</html>
