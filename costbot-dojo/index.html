<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CostBot: Dojo</title>
<link rel="icon" href="../shared/assets/costbot.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#04060b;overflow:hidden;}
  #game{position:absolute;inset:0;}
  #boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#04060b;color:#93a4c4;font-family:'Segoe UI',system-ui,sans-serif;gap:14px;z-index:5;}
  #boot img{width:96px;animation:b 2s ease-in-out infinite}
  @keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  /* Navigation belongs to the shell page, not the game — an embedded host
     supplies its own, so this link never ships inside the mini-game. */
  #back{position:fixed;top:12px;left:14px;z-index:6;display:flex;gap:7px;align-items:center;
    background:rgba(8,13,24,.78);border:1px solid #2b3f66;color:#a9bad6;text-decoration:none;
    padding:7px 14px;border-radius:20px;font:600 13px 'Segoe UI',system-ui,sans-serif;
    backdrop-filter:blur(4px);transition:opacity .3s,background .14s,color .14s;}
  #back:hover{background:#1d2b45;color:#fff;border-color:#5a7cb5;opacity:1 !important;}
  #back img{width:18px;height:18px;object-fit:contain}
  /* hide entirely during a round so it never overlaps the HUD; it returns on
     every menu screen, and Esc gives you a way out mid-round */
  #back.dim{opacity:0;pointer-events:none}
</style>
</head>
<body>
  <a id="back" href="../index.html" title="Back to the CostBot Arcade">
    <img src="../shared/assets/costbot.png" alt="">← Arcade</a>
  <div id="game"></div>
  <div id="boot"><img src="../shared/assets/costbot.png" alt=""><div>Rolling out the mat…</div></div>

  <script src="../shared/arcade-sync.js"></script>
  <script src="../shared/arcade-wallet.js"></script>
  <script src="../shared/arcade-music.js"></script>
  <script src="../shared/arcade-biomes.js"></script>
  <script src="../shared/arcade-trivia.js"></script>
  <script src="cd-content.js"></script>
  <script src="cd-motion.js"></script>
  <script src="cd-game.js"></script>
  <script>
    // Standalone shell: full menu, dojo setup, records, localStorage progression.
    // When the arcade is served by the aix-proto app there is also a server-side
    // profile; ArcadeSync supplies it and stays silent on static hosting.
    let game;
    (async () => {
    const session = window.ArcadeSync ? await window.ArcadeSync.init() : { enabled: false };
    game = CostBotDojo.mount('#game', {
      showShell: true,
      persist: true,
      meta: session.enabled && window.ArcadeSync.gameProfile
        ? window.ArcadeSync.gameProfile('costbot-dojo') || undefined
        : undefined,
      onEvent(type, payload) {
        // Handy while iterating — watch the host-facing event stream in devtools.
        if (type !== 'ready') console.log('[CostBotDojo]', type, payload);
        // keep the Arcade link out of the way while a round is in progress
        const back = document.getElementById('back');
        if (back && type === 'run:start') back.classList.add('dim');
        if (back && type === 'run:end') back.classList.remove('dim');
      },
      onComplete(result) {
        console.log('[CostBotDojo] round complete', result);
        if (window.ArcadeSync && window.ArcadeSync.enabled) {
          window.ArcadeSync.saveGame('costbot-dojo', game.meta);
          window.ArcadeSync.submit(result, null);
        }
      },
    });
    window.game = game;
    // setup and records change outside a round — keep them synced
    if (session.enabled) {
      setInterval(() => window.ArcadeSync.saveGame('costbot-dojo', game.meta), 20000);
    }
    })();
    window.addEventListener('load', () => {
      const b = document.getElementById('boot');
      setTimeout(() => { b.style.transition = 'opacity .4s'; b.style.opacity = 0;
        setTimeout(() => b.remove(), 420); }, 300);
    });
  </script>
</body>
</html>
