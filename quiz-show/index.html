<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CostBot Quiz Show — CostBot Arcade</title>
<link rel="icon" href="../shared/assets/costbot.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a0710;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;}
  #game{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 0%,#0a1150,#04061c 72%);
    background-size:140% 140%;animation:qsbg 24s ease-in-out infinite;}
  @keyframes qsbg{0%,100%{background-position:50% 0%}50%{background-position:44% 8%}}
  #boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#04061c;color:#f5cd63;font-family:'Segoe UI',system-ui,sans-serif;gap:14px;z-index:5;}
  #boot img{width:96px;animation:b 2s ease-in-out infinite}
  @keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  #back{position:fixed;top:12px;left:14px;z-index:6;display:flex;gap:7px;align-items:center;
    background:rgba(6,16,80,.8);border:1px solid #2a3aa8;color:#dbe4ff;text-decoration:none;
    padding:7px 14px;border-radius:20px;font:600 13px 'Segoe UI',system-ui,sans-serif;
    backdrop-filter:blur(4px);transition:opacity .3s,background .14s,color .14s;}
  #back:hover{background:#0a1a8a;color:#fff;border-color:#d9a441;opacity:1 !important;}
  #back img{width:18px;height:18px;object-fit:contain}
  #back.dim{opacity:0;pointer-events:none}
</style>
</head>
<body>
  <a id="back" href="../index.html" title="Back to the CostBot Arcade">
    <img src="../shared/assets/costbot.png" alt="">← Arcade</a>
  <div id="game"></div>
  <div id="boot"><img src="../shared/assets/costbot.png" alt=""><div>Calling the meeting to order…</div></div>

  <script src="../shared/arcade-sync.js"></script>
  <script src="../shared/arcade-wallet.js"></script>
  <script src="../shared/arcade-music.js"></script>
  <script src="qs-content.js"></script>
  <script src="qs-game.js?v=8"></script>
  <script>
    let game;
    (async () => {
      const session = window.ArcadeSync ? await window.ArcadeSync.init() : { enabled: false };
      if (window.ArcadeWallet) window.ArcadeWallet.init();
      game = QuizShow.mount('#game', {
        persist: true,
        meta: session.enabled && window.ArcadeSync.gameProfile
          ? window.ArcadeSync.gameProfile('quiz-show') || undefined
          : undefined,
        onEvent(type, payload) {
          if (type !== 'ready') console.log('[QuizShow]', type, payload);
          // Quiz Show is turn-based, not real-time — there's no reason to hide
          // the way out mid-round the way a rhythm/action cabinet would, so
          // #back stays visible for the whole session (menu, board, clue,
          // Final Forecast, result).
        },
        onComplete(result) {
          console.log('[QuizShow] game complete', result);
          if (window.ArcadeSync && window.ArcadeSync.enabled) {
            window.ArcadeSync.saveGame('quiz-show', game.meta);
            window.ArcadeSync.submit(result, null);
          }
        },
      });
      window.game = game;
      if (session.enabled) {
        setInterval(() => window.ArcadeSync.saveGame('quiz-show', game.meta), 20000);
      }
    })();
    window.addEventListener('load', () => {
      const b = document.getElementById('boot');
      setTimeout(() => { b.style.transition = 'opacity .4s'; b.style.opacity = 0;
        setTimeout(() => b.remove(), 420); }, 300);
    });
  </script>
</body>
</html>
